services:
  wwtp:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: ${WWTP_IMAGE:-wwtp-mmseg:torch2.1.2-cu121}
    working_dir: /workspace
    volumes:
      - .:/workspace
      - torch-cache:/root/.cache/torch
      - huggingface-cache:/root/.cache/huggingface
    shm_size: 8gb
    gpus: all
    environment:
      PYTHONPATH: /workspace
      PYTHONDONTWRITEBYTECODE: "1"
      WWTP_DATA_ROOT: ${WWTP_DATA_ROOT:-/workspace/wwtp_semantic_dataset_1m}
      CUBLAS_WORKSPACE_CONFIG: ":4096:8"
volumes:
  torch-cache:
  huggingface-cache:
